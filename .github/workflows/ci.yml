name: CI (light)

# Light CI: runs on EVERY pull request, including documentation-only ones.
# The full suite lives in full-ci.yml and runs only for changes that touch
# code, on the PR into main and again on the merge commit.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-light-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-checks:
    name: Quick checks (schema export + schema-only eval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra dev

      - name: Export schemas
        run: uv run espresso export-schemas

      - name: Check exported schemas
        run: uv run espresso export-schemas --check

      - name: Run schema-only eval
        run: uv run espresso eval --schemas-only

  # Runs on EVERY pull request, including documentation-only ones. The full
  # gate skips those (see full-ci.yml), but the hygiene test reads files under
  # docs/ and asserts on their content, so it still has to run. It takes about
  # a second.
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra dev

      - name: Run repository hygiene tests
        run: uv run python -m pytest tests/kernel/test_repository_hygiene.py -q
