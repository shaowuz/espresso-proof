name: CI (light)

on:
  workflow_dispatch:

concurrency:
  group: ci-light-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-checks:
    name: Quick checks (schema export + schema-only eval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra dev

      - name: Export schemas
        run: uv run espresso export-schemas

      - name: Check exported schemas
        run: uv run espresso export-schemas --check

      - name: Run schema-only eval
        run: uv run espresso eval --schemas-only

  merge-policy:
    name: Merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only meaningful for pull requests (uses the PR head ref).
    if: ${{ github.event_name == 'pull_request' }}
    steps:
        run: |
          exit 1

      - name: Merge policy passed
        run: |
          echo "Merge policy passed for branch ${{ github.event.pull_request.head.ref }}."
