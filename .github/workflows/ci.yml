name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Export schemas
        run: python scripts/export_schemas.py

      - name: Check generated schemas are committed
        run: git diff --exit-code

      - name: Run pytest
        run: python -m pytest -q

      - name: Run mock eval fixtures
        run: espresso eval --mode mock

      - name: Run schema-only eval
        run: espresso eval --schemas-only

      - name: Check VS Code UI bridge
        run: python scripts/check_vscode_ui.py

      # Goal 40A autoprover baseline: deterministic conservative-behaviour
      # benchmark + safety calibration over the mock fixtures. Both exit
      # non-zero on any planted overconfidence regression.
      - name: Run conservative-behaviour benchmark
        run: espresso benchmark --out-root .benchmark_runs --json-out .benchmark_runs/benchmark.json

      - name: Run safety calibration baseline
        run: espresso calibration --out-root .benchmark_runs --json-out .benchmark_runs/calibration.json
