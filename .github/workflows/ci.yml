name: CI (light)

env:
  # Opt into Node 24 for JS actions ahead of the 2026-06-16 forced switch
  # (GitHub deprecates Node 20). checkout@v4 / setup-python@v5 already support
  # Node 24; this makes the lane forward-safe and verifiable now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Free-minute budget: this auto lane runs ONLY light checks, and ONLY for PRs
# targeting main and pushes to main. Normal branch pushes (and PRs to other
# branches) trigger nothing. The full test/build/eval/UI suite is manual —
# see .github/workflows/full-ci.yml (workflow_dispatch only).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref/PR so we never pay for stale work.
concurrency:
  group: ci-light-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-checks:
    name: Quick checks (schema drift + schema-only eval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      # Cheap, high-value gates: catch a model/schema mismatch and an invalid
      # schema set. The full pytest/eval/benchmark/scorecard suite is manual.
      - name: Export schemas
        run: python scripts/export_schemas.py

      - name: Check generated schemas are committed
        run: git diff --exit-code

      - name: Run schema-only eval
        run: espresso eval --schemas-only

  merge-policy:
    name: Merge policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only meaningful for pull requests (uses the PR head ref).
    if: ${{ github.event_name == 'pull_request' }}
    steps:
        run: |
          exit 1

      - name: Merge policy passed
        run: |
          echo "Merge policy passed for branch ${{ github.event.pull_request.head.ref }}."
