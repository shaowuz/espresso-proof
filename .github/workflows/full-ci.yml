name: Full CI (merge gate)

# Full-suite policy: the full gate runs ONLY here, when a change is merging
# into main on GitHub (PR into main + the merge commit itself). Local
# iteration uses quick/scoped checks only — never run the full suite locally.
#
# The paths-ignore list below is what keeps a README edit from costing 34
# minutes of hosted runner time.
#
# Ignoring all of docs/ is safe only because of a specific arrangement:
# tests/kernel/test_repository_hygiene.py is the one test that reads real files
# under docs/, and ci.yml now runs it on EVERY pull request in about a second.
# So a documentation-only change is still checked by the test that can fail on
# it — just without the 34-minute suite behind it. If another test ever starts
# reading docs/, either add it to that hygiene job or narrow this list.
#
# full-ci-skip.yml reports these same job names as success for the ignored
# paths, so these can safely be required checks in branch protection without
# path-filtered PRs blocking forever.
on:
  pull_request:
    branches: [main]
    paths-ignore: &docs-only
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
  push:
    branches: [main]
    paths-ignore: *docs-only
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to run the full suite against
        required: false
        default: ''

concurrency:
  # Keyed by SHA on push, by ref on pull_request. On push to main every ref is
  # refs/heads/main, so a ref-keyed group made each merge cancel the previous
  # merge's gate — that happened on 2026-07-28 and silently discarded a merge
  # commit's verification. A merge gate is an audit record; it is not
  # superseded by the next one.
  group: full-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  python-suite:
    name: Python suite (tests + eval + benchmark + scorecard)
    runs-on: ubuntu-latest
    # 30 was not enough on hosted runners: the first two merge-gate runs died
    # at 30:17 in "Run pytest" (conclusion=cancelled), before eval/benchmark/
    # scorecard even started. Local full suite is ~14 min on an M-series; the
    # ubuntu runner needs roughly double, plus the post-pytest steps.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # inputs.ref is empty except on workflow_dispatch, and an empty ref
          # makes checkout use github.sha — a concrete commit. Falling back to
          # github.ref instead resolved to refs/pull/N/merge on pull_request,
          # which GitHub deletes the moment the PR merges; twelve runs died on
          # "couldn't find remote ref refs/pull/N/merge" before reaching a step.
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra dev

      - name: Export schemas
        run: uv run espresso export-schemas

      - name: Check exported schemas
        run: uv run espresso export-schemas --check

      # -n auto --dist loadfile: 16m37s -> 5m47s on the full suite, all 2492
      # tests still passing. loadfile keeps a file's tests on one worker, which
      # is what makes it safe — several suites share a run directory or a writer
      # lock within a file. The flags are here rather than in pyproject addopts
      # because xdist startup dominates the scoped runs people do while
      # developing (0.36s -> 9.1s on a 6-test file).
      - name: Run pytest
        run: uv run python -m pytest -q -n auto --dist loadfile

      - name: Run mock eval fixtures
        run: uv run espresso eval --mode mock

      - name: Run schema-only eval
        run: uv run espresso eval --schemas-only

      - name: Run conservative-behaviour benchmark
        run: uv run espresso benchmark --out-root .benchmark_runs --json-out .benchmark_runs/benchmark.json

      - name: Run safety calibration baseline
        run: uv run espresso calibration --out-root .benchmark_runs --json-out .benchmark_runs/calibration.json

      - name: Run autoprover behavior scorecard
        run: uv run espresso scorecard --out-root .scorecard_runs --json-out .scorecard_runs/scorecard.json --markdown-out .scorecard_runs/scorecard.md

  web-build:
    name: Web build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # inputs.ref is empty except on workflow_dispatch, and an empty ref
          # makes checkout use github.sha — a concrete commit. Falling back to
          # github.ref instead resolved to refs/pull/N/merge on pull_request,
          # which GitHub deletes the moment the PR merges; twelve runs died on
          # "couldn't find remote ref refs/pull/N/merge" before reaching a step.
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Build web
        run: npm run build
