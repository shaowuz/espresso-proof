name: Full CI (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to run the full suite against
        required: false
        default: ''

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-suite:
    name: Python suite (tests + eval + benchmark + scorecard)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --extra dev

      - name: Export schemas
        run: uv run espresso export-schemas

      - name: Check exported schemas
        run: uv run espresso export-schemas --check

      - name: Run pytest
        run: uv run python -m pytest -q

      - name: Run mock eval fixtures
        run: uv run espresso eval --mode mock

      - name: Run schema-only eval
        run: uv run espresso eval --schemas-only

      - name: Run conservative-behaviour benchmark
        run: uv run espresso benchmark --out-root .benchmark_runs --json-out .benchmark_runs/benchmark.json

      - name: Run safety calibration baseline
        run: uv run espresso calibration --out-root .benchmark_runs --json-out .benchmark_runs/calibration.json

      - name: Run autoprover behavior scorecard
        run: uv run espresso scorecard --out-root .scorecard_runs --json-out .scorecard_runs/scorecard.json --markdown-out .scorecard_runs/scorecard.md

  web-build:
    name: Web build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci

      - name: Run web tests
        run: npm test

      - name: Build web
        run: npm run build
