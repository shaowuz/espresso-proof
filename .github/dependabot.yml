version: 2

# Grouped on purpose. Enabling Dependabot on this repository opened eleven
# separate pull requests in one go. A lockfile change is a code change, so each
# one triggers the full merge gate.
# Grouping collapses a round of updates into one PR per ecosystem, and splitting
# major bumps into their own group keeps the risky ones visible instead of
# hidden inside a batch.

updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
    ignore:
      # TypeScript 6 already breaks the build: `tsc -b` rejects the
      # side-effect CSS import in src/main.tsx with TS2882. Verified twice
      # against merged results (#279 at 7.0.2, #287 at 6.0.3) — tests passed,
      # the build did not.
      #
      # This bound was `>=7` first. Dependabot then proposed 6.0.3, which slid
      # underneath it, so the same broken upgrade came back a third time. Patch
      # and minor updates to typescript 5.x still come through; the bound comes
      # out when someone does the TS 6 migration deliberately.
      - dependency-name: "typescript"
        versions: [">=6"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]
