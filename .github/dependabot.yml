version: 2

# Grouped on purpose. Enabling Dependabot on this repository opened eleven
# separate pull requests in one go. A lockfile change is a code change, so each
# one triggers the full merge gate.
# Grouping collapses a round of updates into one PR per ecosystem, and splitting
# major bumps into their own group keeps the risky ones visible instead of
# hidden inside a batch.

updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]
