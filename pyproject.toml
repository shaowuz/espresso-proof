[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "espresso-proof"
version = "0.1.0"
description = "Local schema-checked proof-sketch critique kernel for Espresso Proof."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
espresso = "espresso_proof.cli:app"
espresso-codex-agent = "espresso_proof.agents.codex_adapter:main"
espresso-claude-agent = "espresso_proof.agents.claude_adapter:main"
espresso-core-agent = "espresso_proof.agents.espresso_core_adapter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["espresso_proof*"]

[tool.setuptools.package-data]
espresso_proof = ["agent_skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
